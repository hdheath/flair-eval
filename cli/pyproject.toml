[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "flair-eval"
dynamic = ["version"]
description = "Set up, check and launch the flair-eval Nextflow pipeline (compare FLAIR runs)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=5.4",
    "jsonschema>=4.18",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Environment :: Console",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/hdheath/flair-eval"

[project.scripts]
flair-eval = "flair_eval.cli:main"

[tool.setuptools.dynamic]
version = { attr = "flair_eval.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flair_eval = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
