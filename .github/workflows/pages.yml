# Tests the front ends and publishes frontend/builder/ to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Builder page

on:
  push:
    branches: [main]
    paths:
      - "frontend/builder/**"
      - "assets/schema/**"
      - "cli/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "frontend/builder/**"
      - "assets/schema/**"
      - "cli/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Schema copies are current
        run: python cli/tools/sync_schemas.py --check
      - name: Install the CLI
        run: pip install -e "cli[test]"
      - name: CLI and page tests
        run: pytest cli/tests -q

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp frontend/builder/index.html frontend/builder/app.js frontend/builder/logic.js \
             frontend/builder/schemas.js _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
